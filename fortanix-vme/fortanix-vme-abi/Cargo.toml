[package]
name = "fortanix-vme-abi"
version = "0.1.0"
edition = "2018"
authors = ["Fortanix, Inc."]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }
serde = { version = "1.0", default-features = false, optional = true }
thiserror = { version = "2.0", optional = true }

[dev-dependencies]
serde_cbor = { version = "0.11" }

[features]
std = ["serde/std", "thiserror"]
default = ["std"]
docs = []
# in the Rust std (fortanix/rust), the `serde/rustc-dep-of-std` feature (defined in fortanix/serde)
# is already added in library/std/Cargo.toml. Omitting it here doesn't break std compilation 
# (Cargo merges features), and allows using upstream `serde` in the rust-sgx workspace.
rustc-dep-of-std = ["core", "alloc", "serde"]
